<div class="forgot-page">

  <div class="forgot-page__content">

    <!-- Back -->
    <a
      routerLink="/login"
      class="forgot-back"
    >
      <span
        class="forgot-back__arrow"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
      </span>

      <span>
        {{ 'auth.backToLogin' | t }}
      </span>
    </a>


    <!-- Card -->
    <div
      #card
      class="forgot-card"
    >

      <!-- Icon -->
      <div
        class="forgot-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          width="30"
          height="30"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
          />

          <path d="m3 7 9 6 9-6" />
        </svg>
      </div>


      <!-- Heading -->
      <div class="forgot-heading">

        <h1>
          {{ 'auth.forgotPasswordTitle' | t }}
        </h1>

        <p>
          {{ 'auth.forgotPasswordDescription' | t }}
        </p>

      </div>


      <!-- Error -->
      @if (formError()) {

        <div
          class="forgot-error"
          role="alert"
        >

          <span
            class="forgot-error__icon"
            aria-hidden="true"
          >
            !
          </span>

          <span>
            {{ formError() }}
          </span>

        </div>

      }


      <!-- Form -->
      <form
        #forgotForm="ngForm"
        class="forgot-form"
        (submit)="$event.preventDefault(); submit(forgotForm)"
        novalidate
      >

        <label class="forgot-field">

          <span class="forgot-field__label">
            {{ 'auth.email' | t }}
          </span>


          <div class="forgot-input">

            <svg
              class="forgot-input__icon"
              viewBox="0 0 24 24"
              width="19"
              height="19"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="5"
                width="18"
                height="14"
                rx="2"
              />

              <path d="m3 7 9 6 9-6" />
            </svg>


            <input
              type="email"
              name="email"
              required
              email
              [(ngModel)]="email"
              #emailField="ngModel"
              autocomplete="email"
              [placeholder]="
                'auth.emailPlaceholder' | t
              "
            />

          </div>


          @if (
            emailField.invalid &&
            emailField.touched
          ) {

            <span class="forgot-field__error">
              {{ 'auth.invalidEmail' | t }}
            </span>

          }

        </label>


        <!-- Submit -->
        <button
          type="submit"
          class="btn btn-primary forgot-submit"
          [disabled]="submitting()"
        >

          @if (submitting()) {

            <span
              class="forgot-spinner"
              aria-hidden="true"
            ></span>

            <span>
              {{ 'common.loading' | t }}
            </span>

          } @else {

            <span>
              {{ 'auth.sendResetCode' | t }}
            </span>

            <svg
              class="forgot-submit__arrow"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14" />
              <path d="m13 6 6 6-6 6" />
            </svg>

          }

        </button>

      </form>


      <!-- Footer -->
      <p class="forgot-footer">

        <span class="text-muted">
          {{ 'auth.rememberPassword' | t }}
        </span>

        <a routerLink="/login">
          {{ 'auth.loginCta' | t }}
        </a>

      </p>

    </div>

  </div>

</div>
