<a class="product-card" [routerLink]="['/products', product._id]">
  <div class="product-card__media">
    @if (product.primaryImageUrl) {
      <img [src]="product.primaryImageUrl | mediaUrl" [alt]="name" loading="lazy" />
    } @else {
      <div class="product-card__placeholder" aria-hidden="true"></div>
    }

    <div class="product-card__badges">
      @if (product.isBestSeller) { <span class="badge badge--ember">Best seller</span> }
      @if (hasDiscount) {
        <span class="badge badge--volt">
          {{ product.discountType === 'percentage' ? '-' + product.discountValue + '%' : ('common.discount' | t) }}
        </span>
      }
    </div>

    <button type="button" class="product-card__wishlist" [class.is-active]="isWishlisted"
      (click)="onToggleWishlist($event)" [attr.aria-pressed]="isWishlisted" aria-label="Toggle wishlist">
      <svg width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isWishlisted ? 'currentColor' : 'none'">
        <path d="M12 20.5s-7.5-4.6-10-9.2C.4 8 1.7 4.5 5 3.4c2.2-.7 4.4.2 5.7 2 .3.4.9.4 1.2 0 1.3-1.8 3.5-2.7 5.7-2 3.3 1.1 4.6 4.6 3 7.9-2.5 4.6-10 9.2-10 9.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="product-card__body">
    <p class="product-card__name">{{ name }}</p>
    <app-rating [value]="product.ratingAverage" [count]="product.reviewCount"></app-rating>
    <div class="product-card__footer">
      <app-price-tag [price]="effectivePrice" [compareAt]="hasDiscount ? product.basePrice : undefined" [prefixFrom]="!!product.priceFrom"></app-price-tag>
      @if (product.stockState) { <app-stock-badge [state]="product.stockState"></app-stock-badge> }
    </div>
  </div>
</a>
