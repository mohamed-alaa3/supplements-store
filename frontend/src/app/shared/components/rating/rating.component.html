<span class="rating" [class.rating--md]="size === 'md'" [attr.aria-label]="displayValue() + ' out of 5'">
  <span class="rating__stars" aria-hidden="true">
    @for (filled of stars(); track $index) {
      <svg viewBox="0 0 20 20" width="14" height="14">
        <path [attr.fill]="filled ? 'var(--color-ember)' : 'var(--color-border-strong)'"
          d="M10 1.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L10 14.7l-5.2 2.8 1-5.8L1.6 7.6l5.8-.8L10 1.5z" />
      </svg>
    }
  </span>
  @if (count !== undefined) {
    <span class="rating__count text-muted">({{ count }})</span>
  }
</span>
