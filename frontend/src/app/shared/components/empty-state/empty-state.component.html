<div class="empty-state" [class.empty-state--error]="kind === 'error'" role="status">
  <div class="empty-state__icon" aria-hidden="true">
    @if (kind === 'error') {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 3h.01M10.3 3.86 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.86a2 2 0 0 0-3.4 0Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    } @else {
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    }
  </div>
  <p class="text-h3">{{ title }}</p>
  @if (body) { <p class="text-muted empty-state__body">{{ body }}</p> }
  <div class="empty-state__actions">
    <ng-content></ng-content>
  </div>
</div>
